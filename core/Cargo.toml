[package]
name = "afterpass-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
quick-xml = "0.42"
serde_json = "1"
wasm-bindgen = "0.2"
flate2 = { version = "1", optional = true }

[features]
# the afterpass-diff command-line tool; off for the wasm build
cli = ["dep:flate2"]

[[bin]]
name = "afterpass-diff"
required-features = ["cli"]

[[test]]
name = "diff_cli"
required-features = ["cli"]

[dev-dependencies]
flate2 = "1"

[profile.release]
opt-level = 3
lto = true
