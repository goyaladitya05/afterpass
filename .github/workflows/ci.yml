name: ci

# Tests and the site build on every push and pull request; a push to main that passes them deploys to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --release
        working-directory: core

  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv run --group dev pytest -q tests
        working-directory: capture

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: rustup target add wasm32-unknown-unknown && cargo install wasm-pack --version 0.15.0 --locked
      - run: npm ci && npm run wasm && npm run build
        working-directory: web
      - name: smoke test (every demo loads, no page or console errors)
        run: |
          npx vite preview --port 4173 --strictPort &
          sleep 2
          node scripts/smoke.mjs
        working-directory: web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [core, capture, web]
    concurrency: pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
