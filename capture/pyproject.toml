[project]
name = "afterpass"
version = "0.1.0"
description = "Capture what a deployment compiler did to a model"
authors = [
    { name = "Aditya Goyal", email = "goyaladitya2403@gmail.com" }
]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "onnx>=1.23.2",
    "openvino>=2026.4.1",
]

[project.scripts]
afterpass = "afterpass.cli:main"

[project.optional-dependencies]
onnxruntime = [
    "onnxruntime>=1.31.0",
]
tensorrt = [
    "cuda-python>=12,<13",
    "tensorrt-cu12>=11.4.0.106",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
corpus = [
    "onnxslim>=0.1.98",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.20.1",
    "ultralytics>=8.4.178",
]
dev = [
    "onnxruntime>=1.31.0",
    "pytest>=9.1.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
